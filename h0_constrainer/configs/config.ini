################################################################################
# H0 CONSTRAINER EXAMPLE CONFIGURATION FILE
################################################################################
# Most parameters are optional - comment them out if not needed.
# 
# The configuration currently in use is the [DEFAULT] section and corresponds 
# to the baseline analysis in the paper, the alternative values and the values
# in the "commented examples" section below may not match realistic configuations.
################################################################################

[DEFAULT]

## Root directory for data files (relative or absolute path)
datadir = ../data/

## Host galaxy distances (Cepheids, TRGB, JAGB, Miras, etc.)
host_data = host_data.dat
; anchors = anchors.dat  # default: N4258, MW, LMC, SMC with geometric distance uncertainties

## SNe Ia calibrators in nearby hosts
sn1a_calib = sn1a_calib.dat
sn1a_hf = sn1a_hf_pp.dat
sn1a_hf_cov = sn1a_covar_pp.dat
sn1a_vp = 2m++
; sn1a_ignore_offdiag = False
; sn1a_intrinsic = 0.0

## SBF calibrators
sbf_calib = sbf_calib.dat
sbf_hf = sbf_hf.dat
sbf_v = 2m++

## Groups file (galaxy group memberships)
groups = groups.dat

## Data filtering (comma-separated, '&' for AND, wildcards * supported)
host_exclude_list = *jagb*, *mira*, b25, SMC
; calib_exclude = M96, *1994*

## Cosmological parameters (for cosmographic expansion)
q0 = -0.55
j0 = 1

## Megamaser H0 measurements 
mm = megamaser.dat
vcorr_mm = 2M++

## Additional constraints
; epm = epm.dat
; vcorr_epm = 2M++
; coma = coma_sn.dat
; sigma_mag_fp = 0.0371

## Error parameters
vpec_error = 240.0
sbf_vpec_error = 240.0

## Output control
; verbose = True
; warn = False
; savefile = results.json
; logfile = output.txt



################################################################################
# COMMENTED EXAMPLES - ALL CONFIGURATION OPTIONS
################################################################################

#===============================================================================
# SYSTEM SETTINGS & OUTPUT
#===============================================================================
; verbose = True / False
; warn = True / False
; logfile = output.txt  # detailed text results
; savefile = results.json  # comprehensive JSON output

#===============================================================================
# HOST GALAXY DISTANCES & GEOMETRIC ANCHORS
#===============================================================================
; host_data = host_data.dat  # Columns: host, mu_host, mu_error, method, anchor, source, PGC
; anchors = anchors.dat  # Default: N4258, MW, LMC, SMC with geometric uncertainties
; unused_hosts_via_covariance = True / False  # hosts without calibrators contribute via covariance

#===============================================================================
# SNe Ia 
#===============================================================================
; sn1a_calib = sn1a_calib.dat  # SNe in nearby hosts
; alpha_sn1a = 0.7164; alpha_sn1a_error = 0.0018  # provide directly OR use Hubble flow
; sn1a_hf = sn1a_hf_pp.dat; sn1a_hf_cov = sn1a_covar_pp.dat  # infer alpha from Hubble flow
; sn1a_vp = 2m++ / plain / sdss / 2mrs / cmb  # velocity frame
; sn1a_ignore_offdiag = True / False  # ignore covariance off-diagonal terms
; sn1a_intrinsic = 0.0  # additional intrinsic dispersion 

## Alternatives
; sn1a_calib = sn1a_cal_csp_burns.dat; sn1a_hf = hf_csp_lluis_v2.dat; sn1a_hf_cov = hf_csp_lluis_v2_cov.dat  # CSP
; sn1a_calib = sn1a_calib_bayessn.dat; sn1a_intrinsic = 0.15; sn1a_hf = sn1a_hf_bayessn.dat  # BayesSN

#===============================================================================
# SNe Ia (INFRARED H/J-BAND)
#===============================================================================
; sn1a_IR = TRUE  # enable IR mode
; sn1a_calib = sn1a_calib_H.dat; sn1a_intrinsic = 0.096; sn1a_hf = sn1a_hf_H.dat  # H-band
; sn1a_calib = sn1a_calib_J.dat; sn1a_intrinsic = 0.125; sn1a_hf = sn1a_hf_J.dat  # J-band
; sn1a_vp = 2m++ / cmb  # IR mode: only 2m++ and cmb supported
; alpha_sn1a = 0.5269; alpha_sn1a_error = 0.0027  

#===============================================================================
# SNe II
#===============================================================================
; sn2_calib = sn2_calib.dat; sn2_hf = sn2_hf.dat; sn2_hf_cov = ...
; alpha_sn2 = 0.204; alpha_sn2_error = 0.008  # provide directly OR infer from HF

#===============================================================================
# TULLY-FISHER
#===============================================================================
; tf_calib = tf_calib.dat; tf_hf = tf_hf.dat; tf_hf_cov = ...
; alpha_tf = -3.116; alpha_tf_error = 0.001  # provide directly OR infer from HF
; tf_v = 2m++ / sdss / 2mrs / cmb  # velocity frame

#===============================================================================
# SURFACE BRIGHTNESS FLUCTUATIONS (SBF)
#===============================================================================
; sbf_calib = sbf_calib.dat; sbf_hf = sbf_hf.dat / sbf_hf_nodust.dat; sbf_hf_cov = ...
; alpha_sbf = -1.57; alpha_sbf_error = 0.05  # provide directly OR infer from HF
; sbf_v = 2m++ / cmb  # 'cmb' uses group frame
; sbf_vpec_error = 275.0  # SBF-specific vpec error (default: 240 km/s)
; groups = groups.dat  # Recommended for SBF

;===============================================================================
# GROUP MEMBERSHIP
#===============================================================================
; groups = groups.dat  # format: group_name host_name intrinsic_dispersion

#===============================================================================
# ADDITIONAL CONSTRAINTS
#===============================================================================
; mm = megamaser.dat; vcorr_mm = 2M++ / GROUP / CF3 / M2000; mm_dz = True / False
; epm = epm.dat; vcorr_epm = 2M++ / CMB; epm_dz = True / False
; coma = coma_sn.dat; sigma_mag_fp = 0.371

#===============================================================================
# FILTERING (HOST & CALIBRATOR DATA)
#===============================================================================
## Pattern syntax: comma-separated (OR), '&' for AND, wildcards (*), 'column:pattern'
## Use EITHER exclude OR include list, not both

## Host filtering (applies to host_data and groups files)
; host_exclude_list = *jagb*, *mira*, B25  # exclude JAGB, Miras, B25
; host_exclude_list = host:N4258&source:R22  # exclude N4258 only from R22
; host_exclude_list = method:ceph_hst, anchor:MW  # exclude HST Cepheids OR MW-anchored
; host_exclude_list = *jwst*, *hst*, *LMC*, SMC  # exclude by telescope/anchor
; host_include_list = source:R22, source:SH0ES  # exclude R22 and SH0ES

## Calibrator filtering (applies to sn1a_calib, sn2_calib, tf_calib, sbf_calib)
; calib_exclude = M96, N1316&2006dd, *1994*  # exclude host M96, SN 2006dd in NGC 1316, 1994 SNe
; calib_exclude = 198*, 199*  # exclude 1980s-1990s SNe
; calib_exclude = source:R22, host:N3109&source:R22  # exclude source
; calib_include = 20*, source:CCHP  # only 21st century SNe OR CCHP source

## Pattern examples
; *jagb* = jagb_jwst, jagb_hst, etc.
; N* = N4258, N1316, NGC*, etc.
; column:pattern = specify which column (host:, source:, method:, anchor:, PGC:, SN:)
; pattern1&pattern2 = AND logic (both must match)
; pattern1, pattern2 = OR logic (either matches)

#===============================================================================
# HUBBLE FLOW REDSHIFT RANGES
#===============================================================================
; zmin_hf = 0.03; zmax_hf = 0.1  # global z bounds
; z_range_sn1a = True / False  # apply z range to SNe Ia HF
; z_range_sn2 = True / False  # apply z range to SNe II HF
; z_range_tf = True / False  # apply z range to TF HF
; z_range_sbf = True / False  # apply z range to SBF HF

## Examples:
; zmin_hf = 0.03; zmax_hf = 0.1; z_range_sn1a = True  # SNe Ia in 0.03 < z < 0.1
; zmin_hf = 0.06; z_range_sn1a = True  # exclude z < 0.06 for SNe Ia

#===============================================================================
# ERROR & COSMOLOGY PARAMETERS
#===============================================================================
; vpec_error = 240.0  # peculiar velocity uncertainty (km/s) for most methods
; sbf_vpec_error = 275.0  # SBF-specific (default: use vpec_error)
; q0 = -0.55  # deceleration parameter (ΛCDM: -0.55)
; j0 = 1.0  # jerk parameter (ΛCDM: 1.0)

#===============================================================================
# ANALYSIS VARIANTS
#===============================================================================
## Baseline: Cepheids + TRGB + SNe Ia + SBF + Megamasers
; host_exclude_list = *jagb*, *mira*, SMC, b25
; sn1a_calib = sn1a_calib.dat; sn1a_hf = sn1a_hf_pp.dat
; sbf_calib = sbf_calib.dat; sbf_hf = sbf_hf.dat; groups = groups.dat; mm = megamaser.dat

## Variants (modify exclusions)
; host_exclude_list = *mira*, SMC, b25  # +JAGB
; host_exclude_list = *jagb*, SMC, b25  # +Miras
; host_exclude_list = *jagb*, *mira*, *ceph*, SMC, b25  # no Cepheids
; host_exclude_list = *jagb*, *mira*, *trgb*, SMC, b25; sbf_calib =; sbf_hf =; groups =  # no TRGB/SBF
; host_exclude_list = *jagb*, *mira*, *MW*, SMC, b25  # no MW/Gaia
; host_exclude_list = *jagb*, *mira*, *LMC*, SMC, b25  # no LMC/DEBs
; host_exclude_list = *jagb*, *mira*, *N4258*, SMC, b25  # no NGC 4258
; host_exclude_list = *jagb*, *mira*, *jwst*, SMC, b25  # no JWST
; host_exclude_list = *jagb*, *mira*, *MW*, *hst*, *LMC*, SMC, b25  # no HST/LMC/MW

## Only SNe Ia
; host_exclude_list = SMC, b25; mm =; sbf_calib =; sbf_hf =; groups =

## Everything available
; host_exclude_list = b25
; sn1a_calib = sn1a_calib.dat; sn1a_hf = sn1a_hf_pp.dat
; sn2_calib = sn2_calib.dat; sn2_hf = sn2_hf.dat
; tf_calib = tf_calib.dat; tf_hf = tf_hf.dat
; sbf_calib = sbf_calib.dat; sbf_hf = sbf_hf.dat; groups = groups.dat
; mm = megamaser.dat; epm = epm.dat; coma = coma_sn.dat; sigma_mag_fp = 0.0371

## CMB frame
; sn1a_vp = cmb; sbf_v = cmb; vcorr_mm = GROUP

################################################################################
# END OF CONFIGURATION FILE
