[build-system]
requires = [
    "setuptools>=64",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "h0_constrainer"
version = "1.0.0"
description = "A cosmological solver package that constrains H0, developed for the H0DN collaboration based on the original IDL code."
authors = [
    { name = "Emre Ozulker", email = "ozulkeremre@gmail.com" }
]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.14.0",
    "pandas>=2.2.0",
    #"matplotlib",
    #"getdist",
    #"emcee",
    #"tqdm"
]

[project.urls]
#Repository = "https://github.com/..."

[project.scripts]
h0_constrainer = "h0_constrainer.cli:cli_entry"
#h0_mcmc = "h0_constrainer.mcmc:constrain"

[tool.setuptools]
packages = ["h0_constrainer"]